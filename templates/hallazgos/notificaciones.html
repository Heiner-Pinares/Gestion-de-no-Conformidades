{% extends 'base.html' %}{% block content %}<div class="shell readable"><h1 class="page-title">Notificaciones</h1><section class="card spaced">{% for n in pagina %}<article class="list-card {% if not n.leida %}notification-unread{% endif %}"><h2>{{ n.titulo }}</h2><p>{{ n.mensaje }}</p><span class="metadata">{{ n.fecha_creacion|date:'d/m/Y H:i' }}</span><form method="post" action="{% url 'notificacion_leer' n.pk %}">{% csrf_token %}<button class="btn slim" type="submit">Ver caso{% if not n.leida %} y marcar leído{% endif %}</button></form></article>{% empty %}<p class="empty">No tienes notificaciones.</p>{% endfor %}</section>{% include 'includes/paginacion.html' %}</div>{% endblock %}
