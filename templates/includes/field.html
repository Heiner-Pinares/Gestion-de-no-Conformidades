{% if field.is_hidden %}{{ field }}{% else %}<div class="field{% if field.field.widget.input_type == 'checkbox' %} field-checkbox{% endif %}">{% if field.field.widget.input_type == 'checkbox' %}{{ field }}{% endif %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-label="obligatorio"> *</span>{% endif %}</label>{% if field.field.widget.input_type != 'checkbox' %}{{ field }}{% endif %}{% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>{% endif %}
